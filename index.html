<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kenduri Kahwin RSVP</title>
  <style>
    :root {
      --green: #1f6b4f;
      --gold: #c9a227;
      --bg: #faf7f0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: #2b2b2b;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: #fff;
      border: 1px solid #e5ddc8;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      padding: 2.5rem 2rem;
      text-align: center;
    }
    .bismillah {
      font-size: 1.05rem;
      font-style: italic;
      color: var(--green);
      margin-bottom: 1.5rem;
    }
    .label {
      letter-spacing: 0.25em;
      text-transform: uppercase;
      font-size: 0.75rem;
      color: var(--gold);
      margin-bottom: 0.5rem;
    }
    h1 { font-size: 1.9rem; color: var(--green); margin-bottom: 0.75rem; }
    .date { font-size: 1.1rem; margin-bottom: 0.25rem; }
    .venue { color: #666; font-size: 0.95rem; margin-bottom: 1.75rem; }
    .btn {
      display: inline-block;
      background: var(--green);
      color: #fff;
      text-decoration: none;
      padding: 0.85rem 2.2rem;
      border-radius: 999px;
      font-size: 1rem;
      letter-spacing: 0.05em;
    }
    .btn:hover { background: #174f3b; }
    .note { margin-top: 1.5rem; font-size: 0.8rem; color: #999; }
  </style>
</head>
<body>
  <main class="card">
    <p class="bismillah">Bismillahirrahmanirrahim</p>
    <p class="label">Wedding Invitation</p>
    <h1>Kenduri Kahwin RSVP</h1>
    <p class="date">21 February 2027</p>
    <p class="venue">Dewan Komuniti Ampang Jaya, Ampang, Selangor</p>
    <a class="btn" href="https://github.com/Nadwiyah/kad-kahwin-rsvp">View on GitHub</a>
    <p class="note">This is a placeholder landing page for the Kenduri Kahwin RSVP PWA project.</p>
  </main>
</body>
</html>
